$MOD = SUPER

# --- Omarchy Cheatsheet Keybinds ---
bind = $MOD, K, exec, $HYPRSCRIPT/cheatsheet.sh

# --- SYSTEM CONTROLS ---
bind = $MOD CTRL, A, exec, $terminal --class systemapp -e wiremix
bind = $MOD CTRL, B, exec, $terminal --class systemapp -e bluetuith
bind = $MOD CTRL, W, exec, $terminal --class systemapp -e impala
bind = $MOD CTRL, S, exec, localsend_app
bind = $MOD CTRL, T, exec, $terminal --class systemapp -e btop

# --- LAUNCHING APPS ---
bind = $MOD, Return, exec, $terminal
bind = $MOD SHIFT, B, exec, $browser
bind = $MOD SHIFT ALT, B, exec, $browser --private-window
bind = $MOD SHIFT, F, exec, $files
bind = $MOD SHIFT, M, exec, $music

# --- NAVIGATING ---
bind = $MOD, Space, exec, $activateMenu
bind = $MOD ALT, Space, exec, rofi -show run # Placeholder for Omarchy control menu
bind = $MOD, Escape, exec, wlogout
bind = $MOD CTRL, L, exec, hyprlock
bind = $MOD, W, killactive
bind = $MOD, T, togglefloating
bind = $MOD, O, pin
bind = $MOD, F, fullscreen, 0
bind = $MOD ALT, F, pseudo

# Workspaces
bind = $MOD, 1, workspace, 1
bind = $MOD, 2, workspace, 2
bind = $MOD, 3, workspace, 3
bind = $MOD, 4, workspace, 4
bind = $MOD, 5, workspace, 5
bind = $MOD, 6, workspace, 6
bind = $MOD, 7, workspace, 7
bind = $MOD, 8, workspace, 8
bind = $MOD, 9, workspace, 9
bind = $MOD, 0, workspace, 10
bind = $MOD, Tab, workspace, e+1
bind = $MOD SHIFT, Tab, workspace, e-1
bind = $MOD CTRL, Tab, workspace, previous
bind = $MOD SHIFT, 1, movetoworkspace, 1
bind = $MOD SHIFT, 2, movetoworkspace, 2
bind = $MOD SHIFT, 3, movetoworkspace, 3
bind = $MOD SHIFT, 4, movetoworkspace, 4
bind = $MOD SHIFT, 5, movetoworkspace, 5
bind = $MOD SHIFT, 6, movetoworkspace, 6
bind = $MOD SHIFT, 7, movetoworkspace, 7
bind = $MOD SHIFT, 8, movetoworkspace, 8
bind = $MOD SHIFT, 9, movetoworkspace, 9
bind = $MOD SHIFT, 0, movetoworkspace, 10

# Directional Workspace/Monitors
bind = $MOD SHIFT ALT, left, movecurrentworkspacetomonitor, l
bind = $MOD SHIFT ALT, right, movecurrentworkspacetomonitor, r
bind = $MOD SHIFT ALT, up, movecurrentworkspacetomonitor, u
bind = $MOD SHIFT ALT, down, movecurrentworkspacetomonitor, d

# Focus & Swap
bind = $MOD, left, movefocus, l
bind = $MOD, right, movefocus, r
bind = $MOD, up, movefocus, u
bind = $MOD, down, movefocus, d
bind = $MOD SHIFT, left, swapwindow, l
bind = $MOD SHIFT, right, swapwindow, r
bind = $MOD SHIFT, up, swapwindow, u
bind = $MOD SHIFT, down, swapwindow, d
# Fallbacks for HJKL users
bind = $MOD, H, movefocus, l
bind = $MOD, L, movefocus, r
bind = $MOD, K, movefocus, u
bind = $MOD, J, movefocus, d

# Resize Windows
bind = $MOD, equal, resizeactive, -40 0
bind = $MOD, minus, resizeactive, 40 0
bind = $MOD SHIFT, equal, resizeactive, 0 40
bind = $MOD SHIFT, minus, resizeactive, 0 -40

# Grouping
bind = $MOD, G, togglegroup
bind = $MOD ALT, G, moveoutofgroup
bind = $MOD ALT, Tab, changegroupactive, f
bind = $MOD ALT, 1, changegroupactive, 1
bind = $MOD ALT, 2, changegroupactive, 2
bind = $MOD ALT, 3, changegroupactive, 3
bind = $MOD ALT, 4, changegroupactive, 4
bind = $MOD ALT, left, moveintogroup, l
bind = $MOD ALT, right, moveintogroup, r
bind = $MOD ALT, up, moveintogroup, u
bind = $MOD ALT, down, moveintogroup, d
bind = $MOD CTRL, left, changegroupactive, b
bind = $MOD CTRL, right, changegroupactive, f

# Scratchpads
bind = $MOD, S, togglespecialworkspace, magic
bind = $MOD ALT, S, movetoworkspace, special:magic

# Mouse Binds
bindm = $MOD, mouse:272, movewindow
bindm = $MOD, mouse:273, resizewindow

# Scroll Zoom
bind = $MOD SHIFT, mouse_down, exec, $zoom
bind = $MOD, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')
bind = $MOD, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}')
bind = $MOD SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor 1

# Hardware Controls
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Utilities (from original)
bind = $MOD SHIFT, P, exec, $colorPicker
bind = $MOD SHIFT, S, exec, $takeScreenshot
bind = , Print, exec, $takeScreenshot # For PrtSC
bind = $MOD SHIFT, code:60, exec, $pickEmoji
bind = $MOD SHIFT, K, exec, $nextKbdLayout
bind = $MOD SHIFT, T, exec, $startTimer
bind = $MOD ALT CTRL, SPACE, exec, $toggleDebugOverlay
