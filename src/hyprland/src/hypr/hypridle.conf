
general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
    ignore_dbus_inhibit = false
}

# Backlight dimming — guarded so desktops without a backlight don't break.
listener {
    timeout = 300                                # 5min.
    on-timeout = brightnessctl -s set 10 || true # set monitor backlight to minimum; silently skip if no backlight.
    on-resume = brightnessctl -r || true         # monitor backlight restore; silently skip if no backlight.
}

# Turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 300                                          # 5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 || true # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight || true        # turn on keyboard backlight.
}

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 660                                                     # 11min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
