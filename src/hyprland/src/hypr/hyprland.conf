# --- Theme & Colors ---
source = ~/.config/assets/palette/palette.conf

# --- Display Settings (Dynamic MacBook Detection) ---
# MacBook Retina Display (Internal) - Forces 2x scale for 2560x1600
monitor = eDP-1, 2560x1600@60, 0x0, 2
# Default/External Monitors (144Hz Desktop) - 1x scale
monitor = , preferred, auto, 1

# --- Modular Configs ---
source = ~/.config/hypr/programs.conf
source = ~/.config/hypr/style.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keys.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/plugins.conf
source = ~/.config/hypr/wallpaper.conf

# --- Global Environment Variables ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Sets your default apps for the system
env = EDITOR,mousepad
env = BROWSER,google-chrome-stable

# --- MacBook / HiDPI Fixes ---
# Apply scaling only if the Retina display is detected
exec-once = hyprctl monitors | grep -q "eDP-1" && export GDK_SCALE=2 && hyprctl notify 1 5000 "rgb(ce7688)" "MacBook Retina Mode Active"
env = XCURSOR_SIZE,32
env = _JAVA_AWT_WM_NONREPARENTING,1

xwayland {
  force_zero_scaling = true
}

# Refresh audio stack on login to adapt to Mac/PC hardware swap
exec-once = systemctl --user restart pipewire wireplumber
exec-once = xdg-settings set default-web-browser google-chrome.desktop
