# TAG:POPUP — floated utility windows
$POPUP_CLASS = feh|mpv|pureref|webcamoid|solaar|psensor|qalculate|iwgtk|easyeffects|desktop-portal|rofi|overskride|waypaper|cheatsheet|systemapp
$POPUP_TITLE = Picture-in-Picture

windowrule = tag +popup, match:class (?i).*($POPUP_CLASS).*
windowrule = tag +popup, match:title (?i).*($POPUP_TITLE).*
windowrule = float 1, match:tag popup
windowrule = focus_on_activate 1, match:tag popup

# Custom popup sizing
windowrule = size 70% 80%, match:class ^(cheatsheet)$
windowrule = center 1, match:class ^(cheatsheet)$
windowrule = size 50% 60%, match:class ^(systemapp)$
windowrule = center 1, match:class ^(systemapp)$

# TAG:FORCED — dialogs that must stay focused
$FORCED_CLASS = rofi|hyprpolkitagent

windowrule = tag +forced, match:class (?i).*($FORCED_CLASS).*
windowrule = stay_focused 1, match:tag forced
windowrule = dim_around 1, match:tag forced

windowrule = suppress_event maximize, match:class .*
windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
