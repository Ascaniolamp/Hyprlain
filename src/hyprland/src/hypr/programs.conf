# --- Standard Apps ---
$terminal = kitty
$browser = google-chrome-stable
$files = dolphin
$editor = mousepad
$zoom = woomer
$menu = rofi
$bar = waybar

# --- Specialized Apps ---
# This opens Apple Music as a standalone window
$music = google-chrome-stable --app=https://music.apple.com

# --- Tools ---
$HYPRSCRIPT = $HOME/.config/hypr/scripts
$colorPicker = hyprpicker -a -fhex
$takeScreenshot = hyprshot --mode=region --freeze --output-folder=Media/Screenshots
$nextKbdLayout = hyprctl switchxkblayout logitech-usb-receiver-keyboard next
$startTimer = $HYPRSCRIPT/timer
$pickEmoji = $menu -show emoji
$toggleDebugOverlay = $HYPRSCRIPT/toggle_debug_overlay
$activateMenu = killall $menu || $menu -show combi
$toggleBar = killall -SIGUSR1 $bar

# --- Startup ---
exec-once = $bar
exec-once = $terminal
exec-once = waycorner
exec-once = udiskie
exec-once = dunst
exec-once = hypridle
exec-once = nm-applet
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Albert & App Rules ---
exec-once = QT_QPA_PLATFORM=xcb albert
exec-once = vesktop
exec-once = antigravity
exec-once = $music
# exec-once = hyprsunset

# --- MacBook Pro Hardware Fixes (Optional/Auto-detected) ---
# Automatically switch to Easy Effects sink if available (standard for Cirrus Logic audio fix)
exec-once = easyeffects --gapplication-service
exec-once = sleep 5 && wpctl set-default $(wpctl status | grep -i "Easy Effects Sink" | head -n 1 | sed 's/[^0-9]*//g' | cut -c 1-2) || true
