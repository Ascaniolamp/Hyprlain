
$HYPRSCRIPT=$HOME/.config/hypr/scripts

$terminal = kitty
$browser = firefox
$files = nautilus
$editor = zeditor
$zoom = woomer
$music = spotify
$menu = rofi
$bar = waybar

$colorPicker = hyprpicker -a -fhex
$takeScreenshot = hyprshot --mode=region --freeze --output-folder=Media/Screenshots
$nextKbdLayout = hyprctl switchxkblayout logitech-usb-receiver-keyboard next
$startTimer = $HYPRSCRIPT/timer
$pickEmoji = $menu -show emoji
$toggleDebugOverlay = $HYPRSCRIPT/toggle_debug_overlay
$activateMenu = killall $menu || $menu -show combi
$toggleBar = killall -SIGUSR1 $bar
$quickAccent = espanso

exec-once = $bar
exec-once = $terminal
# exec-once = $quickAccent start # optional: espanso

# exec-once = sudo systemctl start bluetooth # bluetooth is already enabled on system
exec-once = hyprpm reload
exec-once = udiskie
exec-once = dunst
exec-once = hypridle
# exec-once = nm-applet # NetworkManager tray applet
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = otd-daemon # OpenTabletDriver daemon
# exec-once = hyprsunset
